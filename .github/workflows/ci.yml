name: CI

# Puerta de calidad del monorepo: lint + typecheck + test en cada push y PR.
# Simple a propósito (equipo de una persona): un solo job, cacheado, en verde
# antes de fusionar. El build de contenido (SQLite firmado) y EAS se añadirán
# como jobs/flujos propios cuando existan (Fase 1 y lanzamiento).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita ejecuciones duplicadas al empujar sobre una rama con PR abierto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
